name: Build Demons Whip Full Asset Catalog

on:
  push:
    branches: [docs/full-asset-catalog-2026-08-17]
    paths:
      - .github/workflows/build-full-asset-catalog.yml
      - .catalog_bootstrap/**
      - tools/asset_catalog/**
      - 03_Docs/superpowers/**
  workflow_dispatch:

permissions:
  contents: write

env:
  CATALOG_OUTPUT: /tmp/demons-whip-asset-catalog
  DELIVERY_ZIP: /tmp/Demons_Whip_Asset_Catalog_FULL.zip
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  BLENDER_VERSION: "5.2.0"

concurrency:
  group: demons-whip-full-asset-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-catalog:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout Demons Whip documentation branch
        uses: actions/checkout@v4
        with:
          path: workspace/demons
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.catalog_bootstrap/
            /00_Packs_Raw/
            /01_Assets_Organizados/
            /02_ConceptArt/
            /03_Docs/superpowers/
            /Torment Textures/
            /tools/
            /DEMONS_WHIP_GDD_REBRAND_MASTER_v2.md

      - name: Bootstrap generator and checkout template assets
        run: bash workspace/demons/.catalog_bootstrap/ci_prepare.sh

      - name: Install system dependencies and official Blender
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils libreoffice-writer ffmpeg \
            fonts-dejavu-core fontconfig poppler-utils xvfb xauth \
            libgl1-mesa-dri libegl1 libglx-mesa0 libx11-6 libxi6 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libxxf86vm1
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          BLENDER_ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BLENDER_BASE_URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "/tmp/${BLENDER_ARCHIVE}" \
            "${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "/tmp/blender-${BLENDER_VERSION}.sha256" \
            "${BLENDER_BASE_URL}/blender-${BLENDER_VERSION}.sha256"
          cd /tmp
          grep "${BLENDER_ARCHIVE}" "blender-${BLENDER_VERSION}.sha256" > blender-linux.sha256
          sha256sum --check blender-linux.sha256
          sudo tar -xJf "${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          cd "$GITHUB_WORKSPACE"

          blender --version | head -n 3
          xvfb-run -a blender --background --factory-startup --python-expr \
            "import bpy, numpy; print('BLENDER_RUNTIME_OK', bpy.app.version_string, numpy.__version__)"
          libreoffice --version
          ffmpeg -version | head -n 1
          df -h

      - name: Verify compressed glTF compatibility
        run: |
          cat > /tmp/blender_gltf_smoke.py <<'PY'
          import bpy
          from pathlib import Path

          samples = [
              Path("workspace/template/public/models/props/fen_lilies.glb"),
              Path("workspace/template/public/models/props/kmed_tavern_hollow.glb"),
              Path("workspace/template/public/models/weapons/frostbite.glb"),
          ]
          for sample in samples:
              if not sample.is_file():
                  raise FileNotFoundError(sample)
              bpy.ops.wm.read_factory_settings(use_empty=True)
              bpy.ops.import_scene.gltf(filepath=str(sample.resolve()), import_webp_texture=True)
              meshes = [obj for obj in bpy.context.scene.objects if obj.type == "MESH"]
              if not meshes:
                  raise RuntimeError(f"No mesh objects imported from {sample}")
              print(f"GLTF_SMOKE_OK {sample} meshes={len(meshes)}")
          PY
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender --background --factory-startup --python /tmp/blender_gltf_smoke.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workspace/demons/tools/asset_catalog/requirements.txt

      - name: Install Python dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workspace/demons/tools/asset_catalog/requirements.txt brotli
          cd workspace/demons/tools/asset_catalog
          pytest -q

      - name: Generate Word, PDF, inventories and QA package
        run: xvfb-run -a -s "-screen 0 1280x1024x24" bash workspace/demons/.catalog_bootstrap/ci_generate.sh

      - name: Publish generated documents to branch
        id: publish
        continue-on-error: true
        run: |
          python workspace/demons/tools/asset_catalog/publish_outputs.py \
            --repo-root workspace/demons \
            --output-dir workspace/demons/03_Docs/Asset_Catalog \
            --branch "$CATALOG_BRANCH" \
            --max-batch-mb 120 \
            --max-files-per-batch 24

      - name: Upload complete downloadable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demons_Whip_Asset_Catalog_FULL
          path: |
            /tmp/Demons_Whip_Asset_Catalog_FULL.zip
            /tmp/demons-whip-asset-catalog/build_complete.json
            /tmp/demons-whip-asset-catalog/data/validation_report.json
            /tmp/demons-whip-asset-catalog/data/asset_inventory_full.csv
            /tmp/demons-whip-asset-catalog/qa/qa_summary.json
            /tmp/demons-whip-asset-catalog/qa/pdf_page_audit.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Report repository publication failure
        if: ${{ steps.publish.outcome == 'failure' }}
        run: exit 1
